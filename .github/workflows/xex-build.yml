name: CubEX360 XEX build (authorized Windows runner)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xex:
    # Deliberately self-hosted: the repository must not assume an XDK is installed on GitHub-hosted runners.
    runs-on: [self-hosted, Windows, XBOX360-XDK]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python for candidate validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check configured toolchain
        shell: pwsh
        run: |
          if (-not $env:CUBEX_XEX_BUILD_SCRIPT) { throw 'Configure CUBEX_XEX_BUILD_SCRIPT on the authorized runner.' }
          if (-not (Test-Path -LiteralPath $env:CUBEX_XEX_BUILD_SCRIPT -PathType Leaf)) { throw 'Configured build script was not found.' }
          if (-not $env:CUBEX_XEX_OUTPUT) { throw 'Configure CUBEX_XEX_OUTPUT on the authorized runner.' }
      - name: Build XEX using runner-provided toolchain
        shell: pwsh
        run: |
          & $env:CUBEX_XEX_BUILD_SCRIPT
          $nativeExit = $LASTEXITCODE
          if (-not $?) { throw "Configured XEX build script reported failure." }
          if ($null -ne $nativeExit -and $nativeExit -ne 0) {
            throw "Configured XEX build script failed with exit code $nativeExit"
          }
      - name: Validate XEX candidate
        shell: pwsh
        run: python scripts/validate_xex_build.py
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: CubEX360-default-xex-candidate
          path: default.xex
          if-no-files-found: error
          retention-days: 7
      - name: Record candidate hash
        shell: pwsh
        run: Get-FileHash ./default.xex -Algorithm SHA256 | Format-List
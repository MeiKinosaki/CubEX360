name: CubEX360 libXenon toolchain probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'core-src/**'
      - 'xenon-probe/**'
      - 'scripts/verify-xenon-elf.sh'
      - 'scripts/xex-preflight.sh'
      - '.github/workflows/xenon-build.yml'
jobs:
  host-core-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile core with strict host warnings and run smoke test
        run: |
          set -eu
          cc -std=c99 -Wall -Wextra -Werror -O2 -Icore-src/include \
            core-src/src/memory.c core-src/src/bus.c core-src/src/cpu.c \
            core-src/tests/test_core_host.c -o /tmp/cubex360-core-host-test
          /tmp/cubex360-core-host-test
  host-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile core regression suite with ASan and UBSan
        run: |
          set -eu
          cc -std=c99 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Icore-src/include \
            core-src/src/memory.c core-src/src/bus.c core-src/src/cpu.c \
            core-src/tests/test_core_host.c -o /tmp/cubex360-core-sanitizers
          /tmp/cubex360-core-sanitizers
  xex-preflight-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure XEX build fails closed until real tools are configured
        run: |
          set -eu
          set +e
          sh ./scripts/xex-preflight.sh
          rc=$?
          set -e
          test "$rc" -eq 2

  build-core-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build initial CubEX360 core smoke target
        run: |
          set -eu
          mkdir -p artifacts
          docker pull free60/libxenon:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/core-src \
            free60/libxenon:latest \
            bash -lc 'set -eu; export DEVKITXENON="${DEVKITXENON:-/usr/local/xenon}"; export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"; command -v xenon-gcc; make clean; make; test -s cubex360_core_smoke.elf32; file cubex360_core_smoke.elf32; xenon-objdump -f cubex360_core_smoke.elf32'
          cp core-src/cubex360_core_smoke.elf32 artifacts/
          ./scripts/verify-xenon-elf.sh artifacts/cubex360_core_smoke.elf32 | tee artifacts/ELF32-REPORT.txt
          sha256sum artifacts/cubex360_core_smoke.elf32 | tee artifacts/SHA256SUMS.txt
      - name: Upload core smoke ELF32
        uses: actions/upload-artifact@v4
        with:
          name: cubex360-core-smoke-elf32
          path: artifacts/*
          if-no-files-found: error
  build-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build diagnostic program with Free60 libXenon
        run: |
          set -eu
          mkdir -p artifacts
          docker pull free60/libxenon:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/xenon-probe \
            free60/libxenon:latest \
            bash -lc 'set -eu; export DEVKITXENON="${DEVKITXENON:-/usr/local/xenon}"; export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"; command -v xenon-gcc; make clean; make; test -s cubex360_toolchain_probe.elf32; file cubex360_toolchain_probe.elf32; xenon-objdump -f cubex360_toolchain_probe.elf32'
          cp xenon-probe/cubex360_toolchain_probe.elf32 artifacts/
          ./scripts/verify-xenon-elf.sh artifacts/cubex360_toolchain_probe.elf32 | tee artifacts/ELF32-REPORT.txt
          sha256sum artifacts/cubex360_toolchain_probe.elf32 | tee artifacts/SHA256SUMS.txt
      - name: Upload verified ELF32 diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubex360-libxenon-elf32
          path: artifacts/*
          if-no-files-found: error
